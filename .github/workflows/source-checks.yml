name: Mod source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/VerifySource.py
      - run: python -m unittest discover -s tests -p 'test_source_*.py'
      - run: python scripts/PrepareSource.py --destination build/source
      - run: pip install clang-format==19.1.5
      - run: python build/source/scripts/CheckReviewCppStyle.py
      - name: Compile production rolling-window tests without Siv3D
        run: |
          mkdir -p build/deps/catch2
          curl --fail --location https://raw.githubusercontent.com/catchorg/Catch2/v2.13.6/single_include/catch2/catch.hpp --output build/deps/catch2/catch.hpp
          g++ -std=c++20 -O2 -Ibuild/deps -Ibuild/source/kshootmania/src build/source/tests/headless/RecentTimingWindowTests.cpp -o build/recent-tests
          build/recent-tests --reporter junit --out build/headless-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-test-results
          path: build/headless-results.xml

  windows-timer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run actual Windows timer ownership/fallback tests without Siv3D
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/deps/include/catch2 -Force | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/catchorg/Catch2/v2.13.6/single_include/catch2/catch.hpp -OutFile build/deps/include/catch2/catch.hpp
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual C++ tools missing' }
          $developer = Join-Path $install 'VC/Auxiliary/Build/vcvars64.bat'
          @"
          @echo off
          call "$developer" >nul
          cl /nologo /std:c++20 /EHsc /MT /utf-8 /Ibuild/deps/include /Ioverlay/kshootmania/src overlay/tests/headless/WindowsWaitableTimerTests.cpp /Fobuild/windows-timer-tests.obj /Febuild/windows-timer-tests.exe
          if errorlevel 1 exit /b 1
          build\windows-timer-tests.exe --reporter junit --out build/windows-timer-results.xml
          exit /b %errorlevel%
          "@ | Set-Content build/run-windows-timer.cmd -Encoding utf8
          & cmd /c build\run-windows-timer.cmd
          if ($LASTEXITCODE) { throw 'Windows timer tests failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-timer-test-results
          path: build/windows-timer-results.xml
